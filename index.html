<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1">

    <title>MC22 Performance</title>

    <link
        rel="stylesheet"
        href="styles.css">

</head>

<body>

<header class="topbar">

    <div>

        <h1>
            MC22 PERFORMANCE
        </h1>

        <div class="dashboard-tabs">

    <a
        href="index.html"
        class="dashboard-tab active">
        Agent KPI Dashboard
    </a>

    <a
        href="collection.html"
        class="dashboard-tab">
        Collection / Amounts
    </a>

</div>
    <nav>

        <a
            class="active"
            href="index.html">
            Dashboard
        </a>


        <a href="performance.html">
            Performance Table
        </a>


        <a href="banks.html">
            Bank Targets
        </a>


        <button
            id="logoutBtn"
            type="button"
            class="nav-btn">
            Logout
        </button>

    </nav>

</header>


<main>


    <div
        id="bankTabs"
        class="bank-tabs">
    </div>


    <section class="monthly-targets">

        <div class="monthly-title">

            MONTHLY TARGETS

            <span id="targetLabel">
                (all agents)
            </span>

        </div>


        <div
            id="monthlyValues"
            class="monthly-values">

        </div>

    </section>


    <section class="kpi-grid">


        <div class="kpi-header agent-header">

            AGENT

        </div>


        <div class="kpi-header talk-header">

            ☎ TALKTIME

            <small>
                Total Talktime in minutes
            </small>

        </div>


        <div class="kpi-header rpc-header">

            👥 RPC

            <small>
                Right Party Contacts
            </small>

        </div>


        <div class="kpi-header ptp-header">

            🤝 NPTP

            <small>
                New Promises to Pay
            </small>

        </div>


        <div class="kpi-header payment-header">

            ▣ NPAYMENT

            <small>
                New Payments
            </small>

        </div>


        <div
            id="rows"
            class="dashboard-rows">
        </div>


    </section>

</main>


<div
    id="toast"
    class="toast">
</div>


<script src="config.js"></script>

<script
    type="module"
    src="app.js">
</script>

</body>

</html>
