<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>MC22 Performance</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

<header class="topbar">

    <div class="topbar-left">

        <h1>
            MC22 PERFORMANCE
        </h1>

        <div class="dashboard-links">

            <a
                href="index.html"
                class="dashboard-link active"
            >

            </a>

            <a

            </a>

        </div>

    </div>


    <nav>

        <a
            class="active"
            href="index.html"
        >
            Dashboard
        </a>

        <a href="performance.html">

        </a>

        <a href="banks.html">
            Bank Targets
        </a>

        <button
            id="logoutBtn"
            type="button"
            class="nav-btn"

        </button>

    </nav>

</header>


<main>

    ====================================================== -->

    <div

    >
    </div>

    ====================================================== -->

    <section class="monthly-targets">

        <div class="monthly-title">

            </span>

        </div>


        <div

    </section>


    <!-- =====================================================

    ====================================================== -->

    <section class="agents-dashboard">

        <div

========================================================= -->

<div
    id="toast"

>
</div>


<script src="config.js"></script>

<script

    src="app.js"

</html>
