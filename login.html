<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MC22 Performance Login</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <h1>
            MC22 PERFORMANCE
        </h1>

        <p>
            Leader Access
        </p>

        <label for="username">
            Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="Enter username"
            autocomplete="username"
        >

        <button
            id="loginBtn"
            type="button"
        >
            Login
        </button>

        <p
            id="loginMessage"
            class="login-message"
        ></p>

    </div>

</div>

<script src="config.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
