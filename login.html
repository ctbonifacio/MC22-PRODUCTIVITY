<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MC22 Login</title><link rel="stylesheet" href="styles.css"></head>
<body class="login-body">
<div class="login-card">
  <h1>MC22 PERFORMANCE</h1><p>Leader Access</p>
  <form id="loginForm">
    <label>Email<input id="email" type="email" required placeholder="leader@email.com"></label>
    <label>Password<input id="password" type="password" required placeholder="Password"></label>
    <button class="btn primary full">Login</button>
  </form>
  <p class="small">First time? Create your leader account in Supabase Authentication, then use that email and password here.</p>
  <div id="loginMsg" class="error"></div>
</div>
<script src="config.js"></script><script type="module" src="auth.js"></script>
</body></html>
